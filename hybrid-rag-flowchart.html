<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive beginner guide to the complete PDF-to-hybrid-RAG retrieval pipeline.">
  <title>Hybrid RAG Retrieval — Complete Beginner Flow</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#07111f; --surface:#0f1d30; --surface2:#14263e; --line:#29435f;
      --text:#f2f7ff; --muted:#a9bad0; --cyan:#62d7ff; --blue:#86aaff;
      --green:#7ee2a8; --yellow:#ffd379; --red:#ff8791; --radius:20px;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:82px}
    body{margin:0;min-width:320px;font:16px/1.62 var(--sans);color:var(--text);background:radial-gradient(circle at 12% 0,rgba(75,123,255,.22),transparent 34rem),radial-gradient(circle at 90% 6%,rgba(57,222,177,.12),transparent 30rem),var(--bg)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(#000,transparent 85%)}
    button{font:inherit;color:inherit} code,pre{font-family:var(--mono)}
    code:not(pre code){padding:.14rem .4rem;border:1px solid rgba(98,215,255,.2);border-radius:7px;color:#c9f0ff;background:rgba(98,215,255,.07);font-size:.92em}
    .shell{width:min(1220px,calc(100% - 32px));margin:auto}.hero{padding:70px 0 42px}.hero-grid{display:grid;grid-template-columns:1fr 350px;gap:36px;align-items:end}
    .eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid rgba(98,215,255,.3);border-radius:999px;color:var(--cyan);background:rgba(98,215,255,.07);font-size:.76rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
    h1,h2,h3{line-height:1.12}h1{max-width:900px;margin:22px 0 16px;font-size:clamp(2.8rem,7vw,5.6rem);letter-spacing:-.055em}.gradient{color:transparent;background:linear-gradient(110deg,#fff,var(--cyan),var(--green));background-clip:text;-webkit-background-clip:text}
    .lead{max-width:810px;margin:0;color:var(--muted);font-size:clamp(1.04rem,2vw,1.25rem)}.lead strong{color:var(--text)}
    .hero-card,.panel{border:1px solid rgba(145,181,217,.17);border-radius:var(--radius);background:rgba(15,29,48,.93);box-shadow:0 24px 65px rgba(0,0,0,.28)}
    .hero-card{padding:23px}.micro{color:var(--cyan);font-size:.75rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.hero-card h3{margin:7px 0;font-size:1.8rem}.hero-card p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:28px}.stat{padding:14px;border:1px solid rgba(145,181,217,.14);border-radius:14px;background:rgba(13,27,46,.72)}.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.78rem}
    .nav-wrap{position:sticky;z-index:20;top:0;padding:9px 0;border-block:1px solid rgba(145,181,217,.15);background:rgba(7,17,31,.9);backdrop-filter:blur(16px)}.nav{display:flex;gap:7px;overflow:auto}.nav a{flex:none;padding:8px 11px;border:1px solid transparent;border-radius:9px;color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:750}.nav a:hover,.nav a.active{color:var(--text);border-color:rgba(98,215,255,.25);background:rgba(98,215,255,.09)}
    main{padding:30px 0 80px}section{margin-bottom:74px}.head{display:grid;grid-template-columns:1fr minmax(260px,430px);gap:28px;align-items:end;margin-bottom:25px}.kicker{margin:0 0 7px;color:var(--green);font-size:.76rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}h2{margin:0;font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.045em}.head>p{margin:0;color:var(--muted)}
    .one-line{display:grid;grid-template-columns:50px 1fr;gap:15px;align-items:center;padding:19px 21px;margin-bottom:20px;border:1px solid rgba(126,226,168,.25);border-radius:17px;background:rgba(126,226,168,.07)}.one-line .badge{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;color:#07160e;background:var(--green);font-weight:900}.one-line strong{color:var(--green)}
    .pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:22px}.node{position:relative;min-height:140px;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(24,45,72,.92),rgba(12,27,46,.92))}.node:not(:nth-child(5n)):after{content:"→";position:absolute;top:50%;right:-14px;z-index:2;color:var(--cyan);font-weight:900}.node b{display:grid;place-items:center;width:29px;height:29px;margin-bottom:14px;border-radius:9px;color:#07111f;background:var(--cyan);font-size:.75rem}.node h3{margin:0 0 6px;font-size:.98rem}.node p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.48}.node.special{border-color:rgba(255,211,121,.35)}.node.special b{background:var(--yellow)}.node.query b{background:var(--green)}
    .pages{display:grid;grid-template-columns:repeat(2,1fr);gap:23px}.page{min-height:500px;padding:23px;border-radius:9px 9px 23px 9px;color:#142236;background:#f6f8fb;box-shadow:0 28px 60px rgba(0,0,0,.3)}.page-top{display:flex;justify-content:space-between;margin-bottom:17px;color:#607187;font:800 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase}.block{margin-bottom:12px;padding:13px 14px;border:2px solid;border-radius:10px;background:#fff}.block:before{content:attr(data-id);display:inline-block;margin-bottom:6px;padding:2px 7px;border-radius:99px;color:#fff;background:#31537d;font:800 .62rem var(--mono)}.block p,.block h3{margin:0}.block h3{font-size:1.35rem}.block p{font-size:.88rem}.block.header{border-color:#ef9ca5;color:#8b2934;background:#fff0f2;text-align:center}.block.header:before{background:#c54d5b}.block.heading{border-color:#66a5db;background:#eef7ff}.block.prose{border-color:#86cba1;background:#f1fbf5}.block.code{border-color:#d7ac56;background:#fff8e8}.block.code p{font: .78rem/1.55 var(--mono)}
    .legend,.chips,.toolbar,.query-buttons{display:flex;flex-wrap:wrap;gap:8px}.legend{margin-top:22px}.legend span,.chip{padding:6px 9px;border:1px solid rgba(145,181,217,.16);border-radius:99px;color:var(--muted);background:rgba(255,255,255,.025);font: .7rem var(--mono)}
    .steps{display:grid;gap:21px}.step{position:relative;overflow:hidden;padding:25px}.step:before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(var(--cyan),var(--blue))}.step-top{display:grid;grid-template-columns:54px 1fr;gap:17px}.num{display:grid;place-items:center;width:54px;height:54px;border:1px solid rgba(98,215,255,.28);border-radius:17px;color:var(--cyan);background:rgba(98,215,255,.08);font-size:1.25rem;font-weight:900}.step h3{margin:0 0 7px;font-size:clamp(1.35rem,3vw,1.95rem)}.step .baby{max-width:860px;margin:0;color:var(--muted)}.step .baby strong{color:var(--text)}.chips{margin:15px 0 0 71px}.chip{color:#c5efff;border-color:rgba(98,215,255,.2);background:rgba(98,215,255,.055)}
    .io{display:grid;grid-template-columns:1fr 70px 1fr;gap:13px;align-items:stretch;margin-top:21px}.box{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#081425}.box-title{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:9px 12px;border-bottom:1px solid rgba(145,181,217,.14);color:var(--muted);background:rgba(255,255,255,.025);font-size:.72rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.copy{padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:transparent;cursor:pointer;font-size:.66rem;text-transform:none;letter-spacing:0}pre{min-height:180px;max-height:400px;overflow:auto;margin:0;padding:15px;color:#d5eaff;font-size:.75rem;line-height:1.58;white-space:pre-wrap}.arrow{display:grid;place-items:center;color:var(--cyan);font-size:1.8rem;font-weight:900}.arrow span{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(98,215,255,.23);border-radius:50%;background:rgba(98,215,255,.07)}.note{margin:17px 0 0 71px;padding:13px 15px;border-left:3px solid var(--green);border-radius:0 11px 11px 0;color:var(--muted);background:rgba(126,226,168,.07);font-size:.89rem}
    .chunk-map{display:grid;gap:9px;margin-top:18px;padding:15px;border:1px solid rgba(145,181,217,.14);border-radius:14px}.chunk-row{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.chunk-row>span{color:var(--muted);font: .72rem var(--mono)}.atoms{display:flex;gap:6px;flex-wrap:wrap}.atom{padding:7px 9px;border:1px solid rgba(134,170,255,.32);border-radius:8px;color:#dfe8ff;background:rgba(134,170,255,.1);font:.7rem var(--mono)}.atom.overlap{border-color:rgba(255,211,121,.55);color:var(--yellow);background:rgba(255,211,121,.1)}
    .model-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:21px}.model{padding:23px;border-top:4px solid var(--cyan)}.model.sparse{border-top-color:var(--yellow)}.model h3{margin:0 0 7px;font-size:1.5rem}.model p{color:var(--muted)}.path{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:16px 0;font:.74rem var(--mono)}.path span{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03)}.path b{color:var(--cyan)}.sparse .path b{color:var(--yellow)}.dense{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:16px 0}.dense i{display:block;aspect-ratio:1;border-radius:4px;background:rgba(98,215,255,var(--v))}.bars{display:grid;gap:10px;margin:16px 0}.bar{display:grid;grid-template-columns:100px 1fr 35px;gap:9px;align-items:center;font:.72rem var(--mono)}.track{height:9px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}.track i{display:block;width:var(--w);height:100%;background:linear-gradient(90deg,#efa934,var(--yellow))}
    .sim{padding:25px}.query-buttons{margin-bottom:17px}.query-button,.small{padding:9px 13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:rgba(255,255,255,.025);cursor:pointer;font-weight:750}.query-button:hover,.query-button.active,.small:hover{color:var(--text);border-color:rgba(98,215,255,.45);background:rgba(98,215,255,.09)}.query-display{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:center;padding:14px 16px;border:1px solid rgba(126,226,168,.25);border-radius:14px;background:rgba(126,226,168,.07)}.query-display b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#06160e;background:var(--green)}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:19px}.rank-col{padding:15px;border:1px solid rgba(145,181,217,.14);border-radius:15px;background:rgba(8,19,34,.7)}.rank-col h3{display:flex;justify-content:space-between;margin:0 0 10px;font-size:.96rem}.rank-col h3 span{color:var(--muted);font-size:.65rem}.rank-item{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center;margin-top:7px;padding:9px;border-radius:9px;background:rgba(255,255,255,.035);font-size:.75rem}.rank-num{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:var(--cyan);background:rgba(98,215,255,.09);font-weight:900}.score{color:var(--muted);font-family:var(--mono)}.context{margin-top:19px;padding:18px;border:1px solid rgba(126,226,168,.25);border-radius:15px;background:rgba(126,226,168,.06)}.context h3{margin:0 0 6px}.context p{margin:0;color:var(--muted)}.context div{margin-top:12px;padding:13px;border-radius:11px;color:#dffbed;background:rgba(2,17,11,.5);font-size:.87rem}
    .toolbar{margin-bottom:14px}.fn-group{margin-bottom:12px;border:1px solid rgba(145,181,217,.15);border-radius:15px;background:rgba(15,29,48,.93)}.fn-group summary{display:flex;justify-content:space-between;padding:17px 19px;cursor:pointer;list-style:none;font-weight:850}.fn-group summary::-webkit-details-marker{display:none}.fn-group summary:after{content:"+";color:var(--cyan);font-size:1.3rem}.fn-group[open] summary:after{content:"−"}.fn-group summary span{color:var(--muted);font-size:.75rem;font-weight:600}.table-wrap{overflow:auto;padding:0 15px 15px}.fn-table{width:100%;min-width:760px;border-collapse:collapse;font-size:.79rem}.fn-table th,.fn-table td{padding:11px;border-top:1px solid rgba(145,181,217,.14);text-align:left;vertical-align:top}.fn-table th{color:var(--muted);font-size:.67rem;letter-spacing:.07em;text-transform:uppercase}.fn-table td:first-child{color:var(--cyan);font-family:var(--mono);font-weight:750;white-space:nowrap}
    .glossary{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.term{padding:17px;border:1px solid rgba(145,181,217,.14);border-radius:14px;background:rgba(255,255,255,.024)}.term h3{margin:0 0 5px;color:var(--cyan);font-size:.98rem}.term p{margin:0;color:var(--muted);font-size:.82rem}.truths{display:grid;gap:9px}.truth{display:grid;grid-template-columns:25px 1fr;gap:10px;padding:12px 14px;border:1px solid rgba(145,181,217,.14);border-radius:12px;color:var(--muted);background:rgba(255,255,255,.02)}.truth b{color:var(--green)}.truth.warn b{color:var(--yellow)}
    footer{padding:25px 0 40px;border-top:1px solid rgba(145,181,217,.14);color:var(--muted);font-size:.8rem}.foot{display:flex;justify-content:space-between;gap:20px}.foot strong{color:var(--text)}
    @media(max-width:1030px){.hero-grid{grid-template-columns:1fr}.hero-card{max-width:600px}.pipeline{grid-template-columns:repeat(3,1fr)}.node:after{display:none}.rank-grid{grid-template-columns:1fr}}
    @media(max-width:790px){.shell{width:calc(100% - 22px)}.stats{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:1fr;gap:10px}.pipeline{grid-template-columns:repeat(2,1fr)}.pages,.model-grid{grid-template-columns:1fr}.io{grid-template-columns:1fr}.arrow{min-height:45px;transform:rotate(90deg)}.chips,.note{margin-left:0}.glossary{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:510px){h1{font-size:2.55rem}.pipeline,.glossary{grid-template-columns:1fr}.step,.sim{padding:18px}.step-top{grid-template-columns:43px 1fr;gap:11px}.num{width:43px;height:43px;border-radius:12px}.page{padding:15px}.chunk-row{grid-template-columns:1fr}.foot{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
